<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las etapas del ser humano</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f8;
      color: #1a1a2e;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .landing {
      background-color: #ffffff;
      max-width: 640px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      text-align: center;
    }

    .landing__title {
      font-size: 2rem;
      padding: 32px 24px 16px;
    }

    .landing__image {
      display: block;
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .landing__description {
      font-size: 1.05rem;
      color: #444;
      padding: 24px 32px 40px;
    }
  </style>
</head>
<body>
  <main class="landing">
    <h1 class="landing__title">Las etapas del ser humano</h1>

    <img
      class="landing__image"
      src="../../imagenes-landing/nino.jpg"
      alt="Retrato de una persona"
    >

    <p class="landing__description">
      Redimensiona la ventana para recorrer las etapas de la vida: niñez,
      adolescencia y adultez.
    </p>
  </main>

  <script>
    const titulo = document.querySelector(".landing__title");
    const descripcion = document.querySelector(".landing__description");
    const imagen = document.querySelector(".landing__image");

    const etapas = {
      nino: {
        titulo: "Niño",
        descripcion:
          "La infancia es la etapa del juego y el descubrimiento. El niño " +
          "explora el mundo con curiosidad, aprende jugando y construye las " +
          "primeras bases de su personalidad.",
        imagen: "../../imagenes-landing/nino.jpg",
        alt: "Retrato de un niño",
      },
      adolescente: {
        titulo: "Adolescente",
        descripcion:
          "La adolescencia es la etapa de los cambios y la búsqueda de " +
          "identidad. El adolescente cuestiona, se afirma frente al mundo y " +
          "empieza a decidir quién quiere ser.",
        imagen: "../../imagenes-landing/adolescente.jpg",
        alt: "Retrato de un adolescente",
      },
      adulto: {
        titulo: "Adulto",
        descripcion:
          "La adultez es la etapa de la autonomía y la responsabilidad. El " +
          "adulto asume sus decisiones, construye proyectos de vida y aporta " +
          "a su entorno con lo aprendido.",
        imagen: "../../imagenes-landing/adulto.jpg",
        alt: "Retrato de un adulto",
      },
    };

    function aplicarEtapa(etapa) {
      titulo.textContent = etapa.titulo;
      descripcion.textContent = etapa.descripcion;
      imagen.src = etapa.imagen;
      imagen.alt = etapa.alt;
    }

    function resize() {
      if (window.innerWidth >= 1024) {
        aplicarEtapa(etapas.adulto);
      } else if (window.innerWidth >= 768) {
        aplicarEtapa(etapas.adolescente);
      } else {
        aplicarEtapa(etapas.nino);
      }
    }

    window.addEventListener("resize", resize);

    resize(); // Ejecutar al cargar, no solo cuando se redimensiona
  </script>
</body>
</html>
